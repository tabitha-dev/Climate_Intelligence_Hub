name: Check real public climate API sources
on:
  push:
    branches: [review/climate-hub-modern-credible-accessible-20261029]
    paths: [scripts/check_live_sources.py, .github/workflows/live-climate-source-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe published JSON endpoints
        run: python scripts/check_live_sources.py
