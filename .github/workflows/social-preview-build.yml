name: Prepare climate social preview PNG
on:
  push:
    branches: [review/climate-hub-modern-credible-accessible-20261029]
    paths:
      - social-preview.svg
      - .github/workflows/social-preview-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg==2.8.2
      - name: Convert share graphic
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          cairosvg.svg2png(url="social-preview.svg",write_to="social-preview.png",output_width=1200,output_height=630)
          p=Path("social-preview.png")
          assert p.stat().st_size > 5000
          print("Rendered social image bytes:",p.stat().st_size)
          PY
      - name: Commit social image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add compatible climate social image PNG'
            git push origin HEAD:review/climate-hub-modern-credible-accessible-20261029
          fi
